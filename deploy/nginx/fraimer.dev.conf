# nginx site config for fraimer.dev
#
# Assumes the repo is deployed at /var/www/fraimer.dev  (adjust `root` if not).
# nginx serves built client assets straight from disk and reverse-proxies
# everything else (SSR + server functions) to the pm2-managed Node app.
#
# Install on the VPS:
#   sudo cp deploy/nginx/fraimer.dev.conf /etc/nginx/sites-available/fraimer.dev
#   sudo ln -s /etc/nginx/sites-available/fraimer.dev /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certs referenced below are issued by certbot BEFORE enabling this — see DEPLOY.md.

upstream fraimer_app {
    server 127.0.0.1:7000;
    keepalive 32;
}

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name fraimer.dev www.fraimer.dev;

    # Let certbot answer renewal challenges over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fraimer.dev$request_uri;
    }
}

# --- HTTPS: canonical host ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fraimer.dev;

    # Built client output — nginx serves these directly from disk.
    root /var/www/fraimer.dev/dist/client;

    ssl_certificate     /etc/letsencrypt/live/fraimer.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraimer.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;

    client_max_body_size 10m;

    # Hashed, immutable build assets — long cache, served from disk.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Any other real file in dist/client (icon.jpg, robots.txt, …) served directly,
    # otherwise hand off to the SSR app.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://fraimer_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: www -> apex redirect ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fraimer.dev;

    ssl_certificate     /etc/letsencrypt/live/fraimer.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fraimer.dev/privkey.pem;

    return 301 https://fraimer.dev$request_uri;
}
